<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THREAD — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F9F8F6; --surface: #FFFFFF; --text: #111111;
      --text-muted: #888888; --accent: #C8622B; --accent-hover: #A8511F;
      --accent-soft: #F8EDE5; --border: #E6E4DF;
      --error: #CC3333; --success: #22C55E; --warn: #F59E0B;
      --font: 'DM Sans', system-ui, sans-serif; --r: 10px;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100dvh; }
    a { text-decoration: none; color: inherit; }

    /* ── LOGIN SCREEN ── */
    .login-screen {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 48px 40px; width: 100%; max-width: 380px; text-align: center;
    }
    .login-logo { font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 6px; }
    .login-logo em { font-style: normal; color: var(--accent); }
    .login-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 36px; }
    .login-icon {
      width: 56px; height: 56px; border-radius: 14px; background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 28px; color: var(--accent);
    }
    .login-card h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }

    .pwd-wrap { position: relative; margin-bottom: 12px; }
    .pwd-wrap input {
      width: 100%; padding: 13px 44px 13px 16px; border: 1.5px solid var(--border);
      border-radius: 8px; font-family: var(--font); font-size: 15px; color: var(--text);
      background: var(--bg); outline: none; text-align: center; letter-spacing: 0.3em;
      transition: border-color 0.2s;
    }
    .pwd-wrap input:focus { border-color: var(--accent); background: #fff; }
    .pwd-wrap input.err { border-color: var(--error); animation: shake 0.35s ease; }
    .toggle-eye {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px;
      transition: color 0.15s;
    }
    .toggle-eye:hover { color: var(--text); }

    .login-err {
      font-size: 12px; color: var(--error); margin-bottom: 16px;
      min-height: 18px; text-align: center;
    }

    .btn-login {
      width: 100%; padding: 13px; background: var(--accent); color: #fff; border: none;
      border-radius: 8px; font-family: var(--font); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.18s, transform 0.1s;
    }
    .btn-login:hover { background: var(--accent-hover); }
    .btn-login:active { transform: scale(0.99); }

    .back-to-store {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-muted); margin-top: 20px;
      transition: color 0.15s;
    }
    .back-to-store:hover { color: var(--text); }

    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }

    /* ── ADMIN PANEL ── */
    .admin-panel { display: none; }
    .admin-panel.show { display: block; }

    header {
      position: sticky; top: 0; z-index: 50;
      background: var(--surface); border-bottom: 1px solid var(--border);
      height: 64px; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
    .logo em { font-style: normal; color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-store {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 16px; border: 1px solid var(--border); border-radius: 6px;
      font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--text);
      background: none; cursor: pointer; transition: border-color 0.15s, background 0.15s;
    }
    .btn-store:hover { border-color: var(--accent); background: var(--accent-soft); }
    .btn-logout {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 16px; border: none; border-radius: 6px;
      font-family: var(--font); font-size: 13px; font-weight: 500;
      color: var(--text-muted); background: none; cursor: pointer; transition: color 0.15s;
    }
    .btn-logout:hover { color: var(--error); }

    .admin-wrap { max-width: 960px; margin: 0 auto; padding: 36px 24px 80px; }
    .admin-top {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 20px; flex-wrap: wrap; margin-bottom: 32px;
    }
    .admin-top h1 { font-size: clamp(22px, 3vw, 30px); font-weight: 700; }
    .admin-top p { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    .stats-row { display: flex; gap: 12px; }
    .stat {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 14px 22px; text-align: center; min-width: 110px;
    }
    .stat-val { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat-val.danger { color: var(--error); }
    .stat-lbl { font-size: 11px; color: var(--text-muted); font-weight: 500; margin-top: 2px; }

    .admin-table { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
    .admin-thead {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1.2fr;
      padding: 11px 20px; background: var(--bg); border-bottom: 1px solid var(--border);
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted);
    }
    .admin-row {
      display: grid; grid-template-columns: 2fr 1fr 1fr 1.2fr;
      padding: 15px 20px; border-bottom: 1px solid var(--border);
      align-items: center; transition: background 0.14s;
    }
    .admin-row:last-child { border-bottom: none; }
    .admin-row:hover { background: var(--bg); }

    .row-product { display: flex; align-items: center; gap: 12px; }
    .row-thumb { width: 38px; height: 50px; border-radius: 5px; flex-shrink: 0; }
    .row-name { font-size: 13px; font-weight: 600; }
    .row-cat { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
    .row-price { font-size: 14px; font-weight: 500; }

    .status-dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
    .status-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-ok  { color: var(--text); }
    .status-ok::before  { background: var(--success); }
    .status-low { color: #92400E; }
    .status-low::before { background: var(--warn); }
    .status-out { color: var(--error); }
    .status-out::before { background: var(--error); }

    .stock-ctrl { display: flex; align-items: center; gap: 8px; }
    .stock-val { font-size: 16px; font-weight: 700; min-width: 28px; text-align: center; }
    .stock-btn {
      width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--border);
      background: none; font-family: var(--font); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.15s; line-height: 1;
    }
    .stock-btn.plus:hover  { background: var(--success); border-color: var(--success); color: #fff; }
    .stock-btn.minus:hover { background: var(--error);   border-color: var(--error);   color: #fff; }

    @media (max-width: 640px) {
      header { padding: 0 16px; }
      .admin-wrap { padding: 24px 16px 60px; }
      .stats-row { gap: 8px; }
      .admin-thead, .admin-row { grid-template-columns: 2fr 1fr 1fr; }
      .admin-thead > *:last-child, .admin-row > *:last-child { display: none; }
    }
  </style>
</head>
<body>

<!-- ════════════════════════════════════
     PANTALLA DE LOGIN
═════════════════════════════════════ -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">THREAD<em> —</em></div>
    <div class="login-subtitle">Panel de administración</div>

    <div class="login-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0110 0v4"/>
      </svg>
    </div>

    <h2>Acceso restringido</h2>
    <p>Introduce la contraseña para acceder al panel</p>

    <div class="pwd-wrap">
      <input type="password" id="pwdInput" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') doLogin()">
      <button class="toggle-eye" onclick="toggleEye()" title="Mostrar/ocultar">
        <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>

    <div class="login-err" id="loginErr"></div>

    <button class="btn-login" onclick="doLogin()">Entrar</button>

    <a href="thread-store.html" class="back-to-store">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Volver a la tienda
    </a>
  </div>
</div>

<!-- ════════════════════════════════════
     PANEL DE ADMINISTRACIÓN
═════════════════════════════════════ -->
<div class="admin-panel" id="adminPanel">

  <header>
    <div class="logo">THREAD<em> —</em> <span style="font-size:11px;font-weight:500;letter-spacing:0.06em;color:var(--text-muted);text-transform:uppercase">Admin</span></div>
    <div class="header-right">
      <a href="thread-store.html" class="btn-store">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Ver tienda
      </a>
      <button class="btn-logout" onclick="doLogout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        Cerrar sesión
      </button>
    </div>
  </header>

  <div class="admin-wrap">
    <div class="admin-top">
      <div>
        <h1>Gestión de inventario</h1>
        <p>Modifica el stock de cada producto en tiempo real</p>
      </div>
      <div class="stats-row">
        <div class="stat">
          <div class="stat-val" id="totalUnits">0</div>
          <div class="stat-lbl">Unidades totales</div>
        </div>
        <div class="stat">
          <div class="stat-val danger" id="soldOutCount">0</div>
          <div class="stat-lbl">Agotados</div>
        </div>
      </div>
    </div>

    <div class="admin-table">
      <div class="admin-thead">
        <div>Producto</div><div>Precio</div><div>Estado</div><div>Stock</div>
      </div>
      <div id="adminList"></div>
    </div>
  </div>

</div>

<script>
  // ══════════════════════════════════════
  //  CONFIGURACIÓN — cambia la contraseña aquí
  // ══════════════════════════════════════
  const ADMIN_PASSWORD = '1234';
  // ══════════════════════════════════════

  const SESSION_KEY = 'thread_admin_auth';

  // ── Datos de productos (igual que la tienda) ──
  const DEFAULTS = [
    { id:1, name:'Tee Oversize Essentials', cat:'camisetas',  price:29, bg:'#D4C5B5', stock:12 },
    { id:2, name:'Graphic Tee Archive',     cat:'camisetas',  price:39, bg:'#2C2C2C', stock:7  },
    { id:3, name:'Cargo Pant Utility',       cat:'pantalones', price:85, bg:'#7A7060', stock:5  },
    { id:4, name:'Jogger Premium Fleece',    cat:'pantalones', price:65, bg:'#4A4A4A', stock:0  },
    { id:5, name:'Cap Structured Logo',      cat:'accesorios', price:24, bg:'#C9B8A0', stock:18 },
    { id:6, name:'Tote Bag Canvas Heavy',    cat:'accesorios', price:19, bg:'#E8DDD0', stock:3  },
  ];

  function loadProducts() {
    const saved = localStorage.getItem('thread_stock');
    if (!saved) return DEFAULTS.map(p => ({...p}));
    const stocks = JSON.parse(saved);
    return DEFAULTS.map(p => ({ ...p, stock: stocks[p.id] ?? p.stock }));
  }

  const products = loadProducts();

  function saveStock() {
    const map = {};
    products.forEach(p => map[p.id] = p.stock);
    localStorage.setItem('thread_stock', JSON.stringify(map));
  }

  // ── Sesión ──
  function isAuthenticated() {
    return sessionStorage.getItem(SESSION_KEY) === 'true';
  }

  function doLogin() {
    const val = document.getElementById('pwdInput').value;
    const input = document.getElementById('pwdInput');
    const err = document.getElementById('loginErr');
    if (val === ADMIN_PASSWORD) {
      sessionStorage.setItem(SESSION_KEY, 'true');
      showPanel();
    } else {
      input.classList.add('err');
      err.textContent = 'Contraseña incorrecta';
      setTimeout(() => input.classList.remove('err'), 400);
      input.value = '';
      input.focus();
    }
  }

  function doLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('adminPanel').classList.remove('show');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('pwdInput').value = '';
    document.getElementById('loginErr').textContent = '';
  }

  function showPanel() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').classList.add('show');
    renderAdmin();
  }

  // ── Mostrar/ocultar contraseña ──
  function toggleEye() {
    const input = document.getElementById('pwdInput');
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    document.getElementById('eyeIcon').style.opacity = isText ? '1' : '0.4';
  }

  // ── Render admin ──
  function renderAdmin() {
    const total = products.reduce((s, p) => s + p.stock, 0);
    const out   = products.filter(p => p.stock === 0).length;
    document.getElementById('totalUnits').textContent  = total;
    document.getElementById('soldOutCount').textContent = out;
    document.getElementById('adminList').innerHTML = products.map(p => {
      const cls   = p.stock === 0 ? 'status-out' : p.stock <= 3 ? 'status-low' : 'status-ok';
      const label = p.stock === 0 ? 'Agotado'    : p.stock <= 3 ? 'Stock bajo'  : 'Disponible';
      return `
        <div class="admin-row">
          <div class="row-product">
            <div class="row-thumb" style="background:${p.bg}"></div>
            <div><div class="row-name">${p.name}</div><div class="row-cat">${p.cat}</div></div>
          </div>
          <div class="row-price">€${p.price}</div>
          <div class="status-dot ${cls}">${label}</div>
          <div class="stock-ctrl">
            <button class="stock-btn minus" onclick="updateStock(${p.id},-1)">−</button>
            <span class="stock-val">${p.stock}</span>
            <button class="stock-btn plus"  onclick="updateStock(${p.id},1)">+</button>
          </div>
        </div>`;
    }).join('');
  }

  function updateStock(id, delta) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    p.stock = Math.max(0, p.stock + delta);
    saveStock();
    renderAdmin();
  }

  // ── Inicialización ──
  if (isAuthenticated()) {
    showPanel();
  }
</script>

</body>
</html>
