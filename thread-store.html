<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THREAD — Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F9F8F6;
      --surface: #FFFFFF;
      --text: #111111;
      --text-muted: #888888;
      --accent: #C8622B;
      --accent-hover: #A8511F;
      --accent-soft: #F8EDE5;
      --border: #E6E4DF;
      --error: #CC3333;
      --success: #22C55E;
      --warn: #F59E0B;
      --font: 'DM Sans', system-ui, sans-serif;
      --r: 10px;
      --r-sm: 6px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100dvh; overflow-x: hidden; }


    /* HEADER */
    header {
      position: sticky; top: 0; z-index: 50; background: var(--surface);
      border-bottom: 1px solid var(--border); height: 64px; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .logo { font-size: 17px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; flex-shrink: 0; text-decoration: none; color: inherit; }
    .logo span { color: var(--accent); }

    .search-wrap { flex: 1; max-width: 300px; position: relative; }
    .search-wrap input {
      width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--border);
      border-radius: var(--r-sm); font-family: var(--font); font-size: 14px;
      background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s;
    }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-wrap .ico {
      position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }

    .cart-btn {
      background: none; border: 1px solid var(--border); border-radius: var(--r-sm);
      padding: 9px 14px; cursor: pointer; font-family: var(--font); font-size: 13px;
      font-weight: 500; color: var(--text); display: flex; align-items: center; gap: 7px;
      transition: border-color 0.2s, background 0.2s;
    }
    .cart-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .cart-badge {
      background: var(--accent); color: #fff; border-radius: 50%;
      width: 18px; height: 18px; font-size: 11px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-badge.hidden { display: none; }

    /* FILTERS */
    .filters {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; gap: 8px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 7px 18px; border: 1px solid var(--border); border-radius: 50px;
      background: none; font-family: var(--font); font-size: 13px; font-weight: 500;
      color: var(--text-muted); cursor: pointer; transition: all 0.18s;
    }
    .filter-btn:hover { border-color: var(--text); color: var(--text); }
    .filter-btn.active { background: var(--text); border-color: var(--text); color: #fff; }

    /* PRODUCTS GRID */
    .products-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px; padding: 28px 24px; max-width: 1200px; margin: 0 auto;
    }

    .product-card {
      background: var(--surface); border-radius: var(--r); border: 1px solid var(--border);
      overflow: hidden; transition: transform 0.18s, box-shadow 0.18s; position: relative;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.08); }
    .product-card.sold-out { opacity: 0.62; }

    .product-img { aspect-ratio: 3 / 4; width: 100%; display: flex; align-items: flex-end; justify-content: flex-end; padding: 12px; }
    .sold-badge { display: none; background: var(--error); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; }
    .product-card.sold-out .sold-badge { display: block; }

    .product-body { padding: 16px; }
    .product-cat { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .product-name { font-size: 14px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
    .product-price { font-size: 17px; font-weight: 700; margin-bottom: 12px; }

    .sizes { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .size-pill {
      padding: 4px 9px; border: 1px solid var(--border); border-radius: 4px; background: none;
      font-family: var(--font); font-size: 11px; font-weight: 500; color: var(--text-muted);
      cursor: pointer; transition: all 0.14s;
    }
    .size-pill.active { background: var(--text); border-color: var(--text); color: #fff; }

    .add-btn {
      width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--r-sm); font-family: var(--font); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 0.18s, transform 0.1s;
    }
    .add-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .add-btn:active:not(:disabled) { transform: scale(0.97); }
    .add-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    /* CART SIDEBAR */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.38); z-index: 90;
      opacity: 0; pointer-events: none; transition: opacity 0.28s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .cart-sidebar {
      position: fixed; top: 0; right: 0; height: 100dvh; width: min(400px, 100vw);
      background: var(--surface); z-index: 91;
      transform: translateX(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      display: flex; flex-direction: column;
    }
    .cart-sidebar.open { transform: translateX(0); }

    .cart-head {
      padding: 22px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .cart-head h2 { font-size: 15px; font-weight: 700; }
    .close-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 20px; line-height: 1; padding: 4px; transition: color 0.15s; }
    .close-btn:hover { color: var(--text); }

    .cart-body { flex: 1; overflow-y: auto; padding: 16px 24px; }
    .cart-empty { text-align: center; padding: 60px 0; color: var(--text-muted); }
    .cart-empty .icon { font-size: 36px; margin-bottom: 12px; }
    .cart-empty p { font-size: 14px; }

    .cart-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .ci-img { width: 56px; height: 72px; border-radius: 6px; flex-shrink: 0; }
    .ci-info { flex: 1; min-width: 0; }
    .ci-name { font-size: 13px; font-weight: 600; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ci-size { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
    .ci-controls { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 26px; height: 26px; border: 1px solid var(--border); border-radius: 4px;
      background: none; font-family: var(--font); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all 0.13s;
    }
    .qty-btn:hover { border-color: var(--text); background: var(--bg); }
    .qty-num { font-size: 14px; font-weight: 600; min-width: 18px; text-align: center; }
    .ci-remove { background: none; border: none; cursor: pointer; font-family: var(--font); font-size: 11px; color: var(--text-muted); text-decoration: underline; padding: 0; margin-top: 3px; }
    .ci-remove:hover { color: var(--error); }
    .ci-price { font-size: 14px; font-weight: 700; white-space: nowrap; }

    .cart-foot { padding: 20px 24px; border-top: 1px solid var(--border); }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    .total-row .lbl { font-size: 13px; color: var(--text-muted); }
    .total-row .val { font-size: 20px; font-weight: 700; }
    .checkout-btn {
      width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none;
      border-radius: var(--r-sm); font-family: var(--font); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 0.18s;
    }
    .checkout-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .checkout-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

    @media (max-width: 640px) {
      header { padding: 0 16px; }
      .search-wrap { max-width: 140px; }
      .filters { padding: 10px 16px; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="thread-home.html" class="logo">THREAD<span> —</span></a>
    <div class="search-wrap">
      <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search" placeholder="Buscar producto..." oninput="handleSearch(this.value)">
    </div>
    <button class="cart-btn" onclick="openCart()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      Carrito
      <span class="cart-badge hidden" id="cartBadge">0</span>
    </button>
  </header>

  <div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Todo</button>
      <button class="filter-btn" onclick="setFilter('camisetas',this)">Camisetas</button>
      <button class="filter-btn" onclick="setFilter('pantalones',this)">Pantalones</button>
      <button class="filter-btn" onclick="setFilter('accesorios',this)">Accesorios</button>
    </div>
    <main>
      <div class="products-grid" id="productsGrid"></div>
    </main>
  </div>

  <div class="overlay" id="overlay" onclick="closeCart()"></div>
  <aside class="cart-sidebar" id="cartSidebar">
    <div class="cart-head">
      <h2>Tu carrito</h2>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-body" id="cartBody">
      <div class="cart-empty"><div class="icon">🛍️</div><p>Tu carrito está vacío</p></div>
    </div>
    <div class="cart-foot">
      <div class="total-row">
        <span class="lbl">Total</span>
        <span class="val" id="cartTotal">€0.00</span>
      </div>
      <button class="checkout-btn" id="checkoutBtn" disabled onclick="handleCheckout()">
        Finalizar compra
      </button>
    </div>
  </aside>

  <script>
    const DEFAULTS = [
      { id:1, name:'Tee Oversize Essentials', cat:'camisetas',  price:29, sizes:['XS','S','M','L','XL'], bg:'#D4C5B5', stock:12 },
      { id:2, name:'Graphic Tee Archive',     cat:'camisetas',  price:39, sizes:['S','M','L'],            bg:'#2C2C2C', stock:7  },
      { id:3, name:'Cargo Pant Utility',       cat:'pantalones', price:85, sizes:['28','30','32','34'],    bg:'#7A7060', stock:5  },
      { id:4, name:'Jogger Premium Fleece',    cat:'pantalones', price:65, sizes:['S','M','L','XL'],       bg:'#4A4A4A', stock:0  },
      { id:5, name:'Cap Structured Logo',      cat:'accesorios', price:24, sizes:['Única'],               bg:'#C9B8A0', stock:18 },
      { id:6, name:'Tote Bag Canvas Heavy',    cat:'accesorios', price:19, sizes:['Única'],               bg:'#E8DDD0', stock:3  },
    ];

    function loadProducts() {
      const saved = localStorage.getItem('thread_stock');
      if (!saved) return DEFAULTS.map(p => ({...p}));
      const stocks = JSON.parse(saved);
      return DEFAULTS.map(p => ({ ...p, stock: stocks[p.id] ?? p.stock }));
    }

    const state = { products: loadProducts(), cart: [], filter: 'all', search: '', sizes: {} };

    function filtered() {
      return state.products.filter(p => {
        const cat  = state.filter === 'all' || p.cat === state.filter;
        const srch = !state.search || p.name.toLowerCase().includes(state.search.toLowerCase());
        return cat && srch;
      });
    }

    function renderProducts() {
      document.getElementById('productsGrid').innerHTML = filtered().map(p => {
        const sel = state.sizes[p.id] ?? p.sizes[0];
        const out = p.stock === 0;
        return `
          <article class="product-card${out ? ' sold-out' : ''}">
            <div class="product-img" style="background:${p.bg}">
              <span class="sold-badge">Agotado</span>
            </div>
            <div class="product-body">
              <div class="product-cat">${p.cat}</div>
              <div class="product-name">${p.name}</div>
              <div class="product-price">€${p.price}</div>
              <div class="sizes">
                ${p.sizes.map(s => `<button class="size-pill${sel===s?' active':''}" onclick="pickSize(${p.id},'${s}')">${s}</button>`).join('')}
              </div>
              <button class="add-btn" ${out?'disabled':''} onclick="addToCart(${p.id})">
                ${out ? 'Agotado' : 'Añadir al carrito'}
              </button>
            </div>
          </article>`;
      }).join('');
    }

    function setFilter(f, btn) {
      state.filter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function handleSearch(v) { state.search = v; renderProducts(); }
    function pickSize(id, s) { state.sizes[id] = s; renderProducts(); }

    function addToCart(id) {
      const p = state.products.find(x => x.id === id);
      if (!p || p.stock === 0) return;
      const size = state.sizes[id] ?? p.sizes[0];
      const key  = `${id}_${size}`;
      const item = state.cart.find(i => i.key === key);
      item ? item.qty++ : state.cart.push({ key, id, name:p.name, size, price:p.price, bg:p.bg, qty:1 });
      updateCart();
      openCart();
    }

    function changeQty(key, delta) {
      const item = state.cart.find(i => i.key === key);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) state.cart = state.cart.filter(i => i.key !== key);
      updateCart();
    }

    function removeItem(key) { state.cart = state.cart.filter(i => i.key !== key); updateCart(); }

    function updateCart() {
      const count = state.cart.reduce((s,i) => s + i.qty, 0);
      const total = state.cart.reduce((s,i) => s + i.price * i.qty, 0);
      const badge = document.getElementById('cartBadge');
      badge.textContent = count;
      badge.classList.toggle('hidden', count === 0);
      document.getElementById('cartTotal').textContent = `€${total.toFixed(2)}`;
      document.getElementById('checkoutBtn').disabled = count === 0;
      const body = document.getElementById('cartBody');
      body.innerHTML = state.cart.length === 0
        ? `<div class="cart-empty"><div class="icon">🛍️</div><p>Tu carrito está vacío</p></div>`
        : state.cart.map(i => `
            <div class="cart-item">
              <div class="ci-img" style="background:${i.bg}"></div>
              <div class="ci-info">
                <div class="ci-name">${i.name}</div>
                <div class="ci-size">Talla: ${i.size}</div>
                <div class="ci-controls">
                  <button class="qty-btn" onclick="changeQty('${i.key}',-1)">−</button>
                  <span class="qty-num">${i.qty}</span>
                  <button class="qty-btn" onclick="changeQty('${i.key}',1)">+</button>
                  <button class="ci-remove" onclick="removeItem('${i.key}')">Eliminar</button>
                </div>
              </div>
              <div class="ci-price">€${(i.price*i.qty).toFixed(2)}</div>
            </div>`).join('');
    }

    function openCart()  { document.getElementById('cartSidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
    function closeCart() { document.getElementById('cartSidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

    function handleCheckout() {
      localStorage.setItem('thread_cart', JSON.stringify(state.cart));
      window.location.href = 'thread-checkout.html';
    }

    renderProducts();
    updateCart();

    // Aplicar filtro inicial si viene desde la home
    (function () {
      const f = localStorage.getItem('thread_initial_filter');
      if (!f || f === 'all') return;
      localStorage.removeItem('thread_initial_filter');
      const btn = [...document.querySelectorAll('.filter-btn')].find(b =>
        b.getAttribute('onclick')?.includes(`'${f}'`)
      );
      if (btn) setFilter(f, btn);
    })();
  </script>
</body>
</html>
